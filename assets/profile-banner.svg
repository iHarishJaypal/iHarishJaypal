<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Harish Jaypal — Developer Profile</title>
  <desc id="desc">A dark futuristic banner featuring PHP, web design, and AI development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".55" stop-color="#101b36"/>
      <stop offset="1" stop-color="#25104a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bb4ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="970" cy="95" r="270" fill="url(#glow)"/>
  <circle cx="1050" cy="170" r="112" fill="none" stroke="url(#accent)" stroke-opacity=".42" stroke-width="1.5"/>
  <circle cx="1050" cy="170" r="82" fill="none" stroke="#a5b4fc" stroke-opacity=".25" stroke-dasharray="5 9"/>
  <path d="M980 170l46-46 46 46-46 46z" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <path d="M1026 124v92M980 170h92" stroke="#a5b4fc" stroke-opacity=".35"/>
  <rect x="72" y="66" width="5" height="222" rx="3" fill="url(#accent)"/>
  <text x="104" y="130" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">DEVELOPER • CREATOR • LEARNER</text>
  <text x="100" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="700">HARISH JAYPAL</text>
  <rect x="104" y="230" width="420" height="4" rx="2" fill="url(#accent)"/>
  <text x="104" y="272" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23">PHP Developer  |  Web Designer  |  AI Enthusiast</text>
  <text x="104" y="316" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">BUILD WITH PURPOSE. LEARN WITHOUT LIMITS.</text>
  <g fill="#c4b5fd" opacity=".8">
    <circle cx="850" cy="72" r="3"/><circle cx="1140" cy="80" r="2"/><circle cx="900" cy="280" r="2.5"/>
    <circle cx="1120" cy="270" r="3"/><circle cx="780" cy="180" r="2"/>
  </g>
